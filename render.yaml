services:
  - type: web
    name: agrinex-web-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT  # ✅ use Render-assigned port
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.12
    plan: free
    autoDeploy: true

